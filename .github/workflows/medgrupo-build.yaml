# Fork medgrupo: build da imagem com o patch do shouldInclude (multi-source
# chart-first). Empurra p/ ghcr.io/nidiodolfini/kubechecks:<tag>.
name: medgrupo-build
on:
  push:
    branches: ['medgrupo/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag da imagem'
        default: 'v3.3.1-medgrupo.1'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMG: ghcr.io/nidiodolfini/kubechecks
      TAG: v3.3.1-medgrupo.1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:${{ github.event.inputs.tag || env.TAG }}
          build-args: |
            GIT_TAG=${{ github.event.inputs.tag || env.TAG }}
            GIT_COMMIT=${{ github.sha }}
